url: https://nerc-ceh.github.io/seabORD/
pandoc: "3.4"

template:
  bootstrap: 5
  light-switch: true
  theme: gruvbox-light
  theme-dark: gruvbox-dark
  bslib:
    bootswatch: lux
    pkgdown-nav-height: 100px
  includes:
    in_header: |
      <link rel="stylesheet" href="extra.css">

assets:
  - extdata

navbar:
  structure:
    left:
      - gettingstarted
      - examples
      - reference
      - news
    right:
      - search
      - github
      - lightswitch

  components:
    gettingstarted:
      text: "GETTING STARTED"
      menu:
        - text: "Installing seabORD"
          href: articles/A_installing_seabord.html
        - text: "seabORD Overview"
          href: articles/B_seabord_overview.html
        - text: "seabORD Inputs"
          href: articles/C_seabord_inputs.html
        - text: "Main Functions"
          href: articles/J_main_functions.html

    examples:
      text: "EXAMPLES"
      menu:
        - text: "Kittiwake Example - Distance-Decay"
          href: articles/G_KI_run_decay.html
        - text: "Kittiwake Example - GPS"
          href: articles/H_KI_run_gps.html
        - text: "Interpreting the Outputs"
          href: articles/I_exampleKI_output.html
        - text: "Create a distance-decay map"
          href: articles/D_DistanceDecayMap.html

    reference:
      text: "REFERENCE"
      href: reference/index.html

    news:
      text: "CHANGELOG"
      href: news/index.html

reference:
  - title: "Functions to run the model"
    contents:
      - seabord

  - title: "Main functions behind the seabORD model"
    contents:
      - calc_adultbmchange
      - calc_adultdee
      - calc_pSurvival
      - calc_puffinmortality
      - calc_chickcare
      - calc_othermortality
      - calc_unattendmortality
      - calc_strategy
      - calc_foragecapture
      - memoised_calc_foragecapture

  - title: "Other functions behind seabORD"
    contents:
      - set_seedvalues
      - set_initialbirdtype
      - set_initialchickstate
      - set_initialbirdstate

  - title: "seabORD distance decay"
    contents:
      - calc_birddensmap_dd_pinfr
      - calc_birddensmap_dd_pinhalf
      - calc_dd_phalf_from_pinfr
      - calc_dd_pinfr_from_phalf
      - calc_dist_restricted
      - voptimise

  - title: "Example data"
    contents:
      - starts_with("get_example")
      - get_spdat

  - title: "Preparing the input"
    contents:
      - set_colony_point
      - set_ORD_buffer
      - set_prey_sequence_in_par
      - calc_pc_in_ORD_buffer
      - calc_calibration_range
      - summarise_ORD_impact
      - check_calibration_inputs

  - title: "Plotting input/output"
    contents:
      - starts_with("plot")

articles:
  - title: "Getting Started"
    contents:
      - A_installing_seabord
      - B_seabord_overview
      - C_seabord_inputs
      - J_main_functions

  - title: "Example Cases"
    contents:
      - G_KI_run_decay
      - H_KI_run_gps
      - I_exampleKI_output
      - D_DistanceDecayMap

home:
  title: "seabORD"
  description: >
    An individual-based model for assessing the effects of offshore
    renewable developments on breeding seabirds.

  sidebar:
    structure:
      - articles_list
      - license
      - citation
      - download
      - links
      - authors
      - dev

    components:
      articles_list:
        title: "GETTING STARTED"
        text: |
          - [Installing seabORD](articles/A_installing_seabord.html)
          - [seabORD Overview](articles/B_seabord_overview.html)
          - [seabORD Inputs](articles/C_seabord_inputs.html)
          - [Main Functions](articles/J_main_functions.html)

      license:
        title: "license"
        text: |
          [OGL-UK-3.0](LICENSE-text.html)

      citation:
        title: "Citation"
        text: |
          Please cite seabORD when using the package or its outputs.

          [View the full citation](authors.html#citation)

      download:
        title: "Download seabORD"
        text: |
          <div class="p-3 border rounded-3 bg-light text-center shadow-sm">
            <a class="btn btn-lg"
               href="https://github.com/NERC-CEH/seabORD/releases/latest"
               role="button"
               style="color:black;border:1px solid black;background-color:white;">
              <i class="bi bi-box-arrow-down"></i> Get seabORD
            </a>
          </div>
